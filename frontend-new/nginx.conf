server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Статика с длинным кешем
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SEO-файлы и API проксируются на backend
    location = /robots.txt   { proxy_pass http://backend:8000/robots.txt; }
    location = /sitemap.xml  { proxy_pass http://backend:8000/sitemap.xml; }

    # Reverse proxy на backend (бьём по префиксам backend-роутера)
    location /api-proxy/ {
        rewrite ^/api-proxy/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 404 для несуществующих ассетов → отдаём index (SPA сам отрендерит 404)
    error_page 404 /index.html;
}
