[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
asyncio_mode = auto
markers =
    unit: быстрые модульные тесты без I/O
    integration: интеграционные тесты с TestClient и in-memory БД
    e2e: сквозные сценарии (запускаются отдельно)
filterwarnings =
    ignore::DeprecationWarning
